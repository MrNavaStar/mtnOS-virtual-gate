<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mtnOS Gate</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="gate-shell">
    <header class="masthead">
      <img id="logo" src="/logo.png" alt="Rabbit Hill Snow Resort" class="logo">
      <div class="gate-label" id="gate-status" data-state="unauthenticated" role="status" aria-live="polite"><span class="pulse"></span><span id="gate-status-text">Not authenticated</span><span class="device" id="device">&mdash;&mdash;</span></div>
    </header>
    <section class="status-panel" id="status-panel" data-state="idle" aria-live="polite">
      <div class="status-topline"><span class="status-mark" id="status-mark">READY</span><span class="status-rule"></span></div>
      <p class="eyebrow" id="eyebrow">Present your access card</p>
      <h1 id="headline">Scan to verify RFID card.</h1>
      <p class="detail" id="detail">Hold your RFID card near the reader to get started.</p>
    </section>
    <footer><span id="last-scan">&mdash;&mdash;</span><span>Rabbit Hill Snow Resort</span></footer>
  </main>
  <script src="/app.js"></script>
</body>
</html>
